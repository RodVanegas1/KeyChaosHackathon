services:
  whisper:
    image: ghcr.io/ggml-org/whisper.cpp:main
    container_name: whisper-local
    command: >
      whisper-server
      --host 0.0.0.0
      --port 8080
      -m /models/ggml-base.bin
    ports:
      - "8081:8080"
    volumes:
      - whisper_models:/models

volumes:
  whisper_models: